[ai_providers]
# Options: "local", "googleai", "openrouter", "ollama", "all"
# - "local": Use LM Studio only
# - "googleai": Use Google AI Studio only
# - "openrouter": Use OpenRouter only
# - "ollama": Use Ollama (local) only with task-based model selection
# - "all": Use fallback system (tries primary providers first, then falls back)
provider = googleai

# Base URL for local LM Studio instance (e.g., http://localhost:1234/v1)
lm_studio_base_url = https://openrouter.ai/api/v1
# Model identifier to use with LM Studio
lm_studio_model = local-model

# Base URL for Ollama instance (default: http://localhost:11434/v1)
ollama_base_url = https://openrouter.ai/api/v1
# Task-based model selection for Ollama (different models for different tasks)
ollama_main_model = qwen2.5:14b           # Main trading analysis (comprehensive)
ollama_math_model = qwen2-math:7b         # Technical indicators & calculations
ollama_reasoning_model = deepseek-r1:7b   # Pattern recognition & strategic reasoning
ollama_summary_model = llama3.1:8b        # Fast news summarization

# Base URL for OpenRouter API
openrouter_base_url = https://openrouter.ai/api/v1
# Primary model to use with OpenRouter (Priority 1)
openrouter_base_model = google/gemini-2.0-flash-exp:free
# Fallback models to use if previous models fail (Priority 2-4)
openrouter_fallback_model_1 = google/gemini-2.0-flash-001
openrouter_fallback_model_2 = google/gemini-2.0-flash-exp:free
openrouter_fallback_model_3 = google/gemini-2.0-flash-001

# Model identifier for Google AI Studio (e.g., gemini-flash-latest, gemini-2.5-flash)
google_studio_model = gemini-2.0-flash-exp

# Groq API settings (high-speed inference)
groq_base_url = https://api.groq.com/openai/v1
groq_model = llama-3.3-70b-versatile

[general]
# Default cryptocurrency pair to analyze if none specified
crypto_pair = BTC/USDC
# Default timeframe for technical analysis (e.g., 1h, 4h, 1d)
timeframe = 4h
# Number of candles to fetch for internal technical analysis calculation
candle_limit = 500
# Number of candles to visualize in the chart images sent to the AI (reduced for Ollama)
ai_chart_candle_limit = 100
# Master switch to enable or disable the Discord bot integration
discord_bot = false
# Enable true multi-agent debate system (3 separate AI calls: Aggressive, Conservative, Referee)
# When enabled, each trading decision uses 3 API calls for cross-validation and hallucination reduction
# When disabled, uses single API call with simulated debate (faster but less rigorous)
use_multi_agent_debate = true

[debug]
# Save generated chart images to disk for debugging purposes
save_chart_images = false
# Directory path to save debug chart images
chart_save_path = chart_images
# Enable detailed logic (DEBUG level) logging
logger_debug = false
# Flag to indicate if running in a test environment (affects some behaviors)
test_environment = false

[directories]
# Directory to store log files
log_dir = logs
# Directory to store persistent data
data_dir = data

[rag]
# Frequency (in hours) to update the RAG knowledge base
update_interval_hours = 4
# Frequency (in hours) to update news categories
categories_update_interval_hours = 24
# Frequency (in hours) to refresh the CoinGecko coin list (999999 = disabled, use Binance directly)
coingecko_update_interval_hours = 999999
# API endpoint for CoinGecko global market data
coingecko_global_api_url = https://api.coingecko.com/api/v3/global
# Maximum number of news articles to include in the AI's context (reduced for Ollama)
news_limit = 4
# Maximum number of relevant sentences to extract per article (reduced for Ollama)
article_max_sentences = 3
# Maximum number of tokens per article chunk for processing (reduced for Ollama)
article_max_tokens = 128

[exchanges]
# List of exchanges to use for symbol lookup (in priority order)
supported = binance,kucoin,gateio,mexc,hyperliquid
# Frequency (in hours) to refresh exchange market data
market_refresh_hours = 24

[demo_trading]
# Transaction fee percentage for limit orders (0.00075 = 0.075%)
transaction_fee_percent = 0.00075

[cooldowns]
# File message expiry is configured in hours; loader converts it to seconds at runtime.
file_message_expiry = 168


[model_config]
# Default model configuration parameters
# Controls randomness: 0.0 = deterministic, 1.0 = creative
temperature = 0.9
# Nucleus sampling: considering tokens with top_p probability mass
top_p = 0.9
# Top-k sampling: considering the top k most likely tokens
top_k = 40
# Frequency penalty to reduce repetition
#freq_penalty = 0.1
# Presence penalty to encourage new topics
#pres_penalty = 0.1
# Maximum number of tokens to generate in the response (increased for Ollama input handling)
max_tokens = 16384

# Google configuration overrides (Google models often require specific settings)
google_temperature = 1.0
google_top_p = 0.9
google_top_k = 40
google_max_tokens = 32768